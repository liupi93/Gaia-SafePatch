# SysCare native-stack scan; see docs/safepatch-explained.md.
# Use an actual executable/PID/full-size function symbol. No business drain claim.
[[hotpatch.targets]]
binary = "/tmp/gaia-safepatch-compatible/document"
symbol = "render_document"
pid = 12345
enabled = false
patch_action = "override_return" # or "skip_call"
override_return_value = 99
patch_mode = "compatible" # explicit opt-in; omitted => "cooperative"

related_functions = [] # e.g. ["other_function"]; full functions, also checked on restore
