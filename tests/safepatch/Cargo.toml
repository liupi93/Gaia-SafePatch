[package]
name = "safepatch-validation"
version = "0.1.0"
edition = "2024"
[workspace]
[dependencies]
anyhow = "1"
libc = "0.2"
object = { version = "0.38.0", default-features = false, features = ["read", "elf"] }
[[bin]]
name = "safepatch-validation"
path = "driver.rs"
[[bin]]
name = "safepatch-compat-validation"
path = "compat_driver.rs"
[[bin]]
name = "safepatch-video-demo"
path = "demo/driver.rs"
